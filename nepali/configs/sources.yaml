language: ne
language_name: Nepali
model: L
tier: lower-resource
sources:
- source_id: wikipedia_ne
  type: huggingface
  dataset: wikimedia/wikipedia
  config: 20231101.ne
  split: train
  text_field: text
  collection: downloaded
  enabled: false
  notes: 'DISABLED: superseded by the local nepali_corpus_local parquet, which needs
    no download.'
- source_id: sangraha_ne
  type: huggingface
  dataset: ai4bharat/sangraha
  data_files: verified/nep/*.parquet
  split: train
  text_field: text
  collection: downloaded
  enabled: false
  notes: 'DISABLED: superseded by the local nepali_corpus_local parquet, which needs
    no download.'
- source_id: nepali_corpus_local
  type: local
  path: nepali/data/raw/nepali_corpus_full.parquet
  text_field: text
  collection: downloaded
  enabled: true
  min_line_chars: 200
  notes: 'Local Nepali corpus, 5.3 GB parquet: 7,167,456 documents with source, domain
    and license metadata. Measured on a 600-document sample it is 100% identified
    as Nepali and cleans at a 77.8% keep rate, so it covers the 400M downloaded requirement
    many times over and needs no download. Read in row-group batches through pyarrow
    rather than loaded whole.'
- source_id: manual_news_ekantipur_ne
  type: scrape
  collection: manual
  enabled: true
  start_urls:
  - https://ekantipur.com/
  allow_patterns:
  - ekantipur\.com/
  deny_patterns:
  - /photo
  - /video
  - /tag/
  - /author/
  - \?
  - /live-
  content_selector: null
  max_pages: 20000
  max_depth: 6
  delay_seconds: 1.0
  cache_dir: nepali/data/raw/scrape_cache
  notes: 'News crawl of ekantipur. Counted as manual collection: the assignment names
    ''scraping + cleaning pages you gather yourself'' as manual. Pages are cached,
    so re-runs replay instantly and only new URLs pay the 1 req/s rate limit. Check
    this site''s terms of use yourself - the crawler honours robots.txt and rate-limits,
    but permission to collect is the student''s responsibility.'
