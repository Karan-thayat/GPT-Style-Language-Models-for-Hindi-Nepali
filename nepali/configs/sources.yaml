- source_id: manual_ocr_ne
  type: local
  collection: manual
  enabled: true
  path: nepali/data/raw/ocr
  glob: '**/*.jsonl'
  text_field: text
  notes: 'Output of `scripts/run_ocr.py --language ne`. Put PDFs in nepali/data/raw/pdf
    and run the script. OCR is the highest-leverage manual source: one 300-page book
    yields ~80,000 words against ~900 for a scraped web page. Needs tesseract-ocr-nep
    for scanned PDFs.

    '
- source_id: manual_typed_ne
  type: local
  collection: manual
  enabled: true
  path: nepali/data/raw/typed
  glob: '**/*.txt'
  split_on_blank_lines: true
  notes: 'Hand-typed or transcribed Nepali text, blank-line separated.

    '
- source_id: manual_scrape_wikisource_ne
  type: scrape
  collection: manual
  enabled: true
  start_urls:
  - https://ne.wikisource.org/wiki/%E0%A4%AE%E0%A5%81%E0%A4%96%E0%A5%8D%E0%A4%AF_%E0%A4%AA%E0%A5%83%E0%A4%B7%E0%A5%8D%E0%A4%A0
  allow_patterns:
  - ne\.wikisource\.org/wiki/
  deny_patterns:
  - action=
  - oldid=
  - 'Special:'
  - 'सहायता:'
  - 'प्रयोगकर्ता:'
  - 'वार्तालाप:'
  content_selector: '#mw-content-text'
  max_pages: 2000
  max_depth: 5
  delay_seconds: 1.0
  cache_dir: nepali/data/raw/scrape_cache
  notes: 'Nepali Wikisource: public-domain Nepali literature. Genuinely Nepali orthography
    and grammar, so it doubles as a positive control for the Hindi-vs-Nepali identity
    filter. Pages are cached, so re-runs replay instantly and only new URLs pay the
    rate limit.

    '
- source_id: manual_scrape_custom_ne
  type: scrape
  collection: manual
  enabled: false
  start_urls:
  - https://example.com/replace-me
  allow_patterns: []
  deny_patterns: []
  content_selector: null
  max_pages: 2000
  max_depth: 3
  delay_seconds: 1.5
  cache_dir: nepali/data/raw/scrape_cache
  notes: 'TEMPLATE - add your own Nepali sites here. Because open Nepali data is scarce,
    manual collection is where Model L''s corpus is won or lost. Check robots.txt
    and terms first; the crawler honours robots.txt and rate-limits, but permission
    to collect is your responsibility.

    '
