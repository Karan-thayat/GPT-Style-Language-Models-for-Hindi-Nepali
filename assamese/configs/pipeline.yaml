# Assamese (Model L) Phase 1 pipeline configuration.
#
# Differences from the Bengali config are deliberate and documented, because the
# lower-resource tier needs different trade-offs, not the same numbers:
#
# * `min_chars`/`min_words` are lower. Assamese web documents are shorter on
#   average, and discarding them at Bengali thresholds throws away a much larger
#   share of a much smaller corpus.
# * Larger validation/test fractions. At 1% each, an Assamese test split would be
#   too small for stable perplexity in Phase 2; 2% each keeps it usable.
# * Smaller default vocabulary. With far fewer training tokens, a 32k vocabulary
#   would contain many pieces seen only a handful of times, whose embeddings
#   cannot be learned well. The sweep tests this rather than assuming it.

language: as
language_name: Assamese
model: L

paths:
  raw_dir: assamese/data/raw
  processed_dir: assamese/data/processed
  tokenizer_dir: assamese/tokenizer
  stats_dir: assamese/reports
  logs_dir: assamese/logs

cleaning:
  min_chars: 120
  min_words: 15
  max_chars: 500000
  min_script_ratio: 0.65
  max_replacement_ratio: 0.003
  max_duplicate_line_ratio: 0.35
  max_top_ngram_ratio: 0.25
  max_digit_ratio: 0.20
  max_symbol_ratio: 0.12
  max_char_run: 20
  # Critical for Assamese: public "Assamese" corpora are known to contain
  # Bengali. Without this filter the two project corpora would overlap in
  # content, violating the independence constraint.
  check_language_identity: true
  dedup_exact: true
  dedup_near: true
  near_dup_threshold: 0.70
  minhash_permutations: 96
  shingle_size: 5

# Split ratios for the full-scale run. Larger held-out fractions than Bengali's
# because Assamese has far less data, so 1% would not give a usable test set.
# The `sampled` profile overrides these - see `profiles` below.
splits:
  train: 0.96
  validation: 0.02
  test: 0.02
  seed: 20260812
  pinned_sources: {}

tokenizer:
  model_type: unigram
  vocab_size: 16000
  character_coverage: 0.9995
  byte_fallback: true
  split_digits: true
  normalization_rule_name: identity
  seed: 20260812
  sweep_vocab_sizes: [4000, 8000, 16000, 24000, 32000]
  sweep_model_types: [unigram, bpe]

profiles:
  sampled:
    per_source_doc_limit: 4000
    tokenizer_max_train_lines: 300000
    sweep_max_train_lines: 150000
    target_train_tokens: null
    # See the Bengali config: a percentage split of a small sampled corpus leaves
    # too few held-out documents to measure fertility or perplexity stably.
    splits:
      train: 0.88
      validation: 0.06
      test: 0.06
  full:
    per_source_doc_limit: null
    tokenizer_max_train_lines: 8000000
    sweep_max_train_lines: 1000000
    # Same 500M target as Bengali. Public Assamese data will almost certainly
    # fall short; the pipeline reports the exact achieved count so the shortfall
    # can be quantified and justified rather than hidden.
    target_train_tokens: 500000000
