language: hi
language_name: Hindi
model: H
tier: higher-resource
sources:
- source_id: wikipedia_hi
  type: huggingface
  dataset: wikimedia/wikipedia
  config: 20231101.hi
  split: train
  text_field: text
  collection: downloaded
  enabled: false
  notes: DISABLED in favour of the local wikipedia_dump_hi below, which is the same
    content already on disk. Re-enable only if the local dump is removed.
- source_id: sangraha_hi
  type: huggingface
  dataset: ai4bharat/sangraha
  data_files: verified/hin/data-0.parquet
  split: train
  text_field: text
  collection: downloaded
  enabled: false
  limit: 3500
  notes: 'DISABLED. Superseded by the local indiccorp.txt below: both are AI4Bharat
    web/news corpora with substantial overlap, so enabling both would pay download
    and processing cost for text that deduplication then discards. Re-enable if you
    need volume beyond what the local file provides.'
- source_id: oscar_hi
  type: huggingface
  dataset: oscar-corpus/OSCAR-2301
  config: hi
  split: train
  text_field: text
  collection: downloaded
  enabled: false
  notes: 'OSCAR-2301 Hindi. Gated - accept the terms on the Hub and run `huggingface-cli
    login`, then set enabled: true. Noisier than Sangraha, so the cleaning thresholds
    matter more here.

    '
- source_id: indiccorp_hi
  type: local
  path: hindi/data/raw/indiccorp.txt
  collection: downloaded
  enabled: true
  one_document_per_line: true
  min_line_chars: 200
  notes: 'AI4Bharat IndicCorp Hindi, held locally as a 5.9 GB plain-text file: 1,121,202
    documents, 480M raw words, one document per line. Measured keep rate 96.8%, with
    99.7% correctly identified as Hindi.

    This is the volume source for the downloaded 80% of the corpus. The full file
    yields ~880M tokens, about 220% of the 400M downloaded requirement, so roughly
    45% of it is read before the token budget is met. No document cap is set: the
    ingest is bounded by --target-tokens instead, which measures the actual budget
    rather than guessing at it through a document count.'
- source_id: manual_scraped_news_hi
  type: local
  path: hindi/data/raw/scraped
  glob: '**/*.txt'
  collection: manual
  enabled: true
  one_document_per_line: true
  min_line_chars: 200
  notes: 'Hindi news scraped by the student: 9.07M words across two files. This is
    manually collected text under the assignment''s definition (scraping pages you
    gather yourself), and it is currently the single largest contributor to the >=20%
    manual requirement - larger than all the OCR''d books combined. One document per
    line, streamed rather than loaded.'
- source_id: wikipedia_dump_hi
  type: local
  path: hindi/data/raw/downloaded
  glob: '**/*.txt'
  collection: manual
  enabled: true
  one_document_per_line: true
  min_line_chars: 200
  notes: 'Local Hindi Wikipedia dump, 45.6M words. Counted as MANUAL on the course''s
    explicit ruling: asked whether Wikipedia dumps count toward manual collection,
    the TA answered ''Yes, just preprocess them using a script'', and separately confirmed
    that raw unprocessed corpora taken from the internet also count. The dump arrives
    as an unprocessed language-organized archive, and this project''s own extraction,
    normalization and cleaning pipeline is what turns it into corpus text.

    Kept also for register variety: IndicCorp is news and web text, so encyclopedic
    prose broadens what Model H sees.'
- source_id: manual_news_bhaskar_hi
  type: scrape
  collection: manual
  enabled: false
  start_urls:
  - https://www.bhaskar.com/
  allow_patterns:
  - bhaskar\.com/
  deny_patterns:
  - /photo
  - /video
  - /tag/
  - /author/
  - \?
  - /live-
  content_selector: null
  max_pages: 20000
  max_depth: 6
  delay_seconds: 1.0
  cache_dir: hindi/data/raw/scrape_cache
  notes: 'News crawl of bhaskar. Counted as manual collection: the assignment names
    ''scraping + cleaning pages you gather yourself'' as manual. Pages are cached,
    so re-runs replay instantly and only new URLs pay the 1 req/s rate limit. Check
    this site''s terms of use yourself - the crawler honours robots.txt and rate-limits,
    but permission to collect is the student''s responsibility.'
