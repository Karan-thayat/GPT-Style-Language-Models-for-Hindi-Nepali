language: hi
language_name: Hindi
model: H
script: devanagari
paths:
  raw_dir: hindi/data/raw
  processed_dir: hindi/data/processed
  tokenizer_dir: hindi/tokenizer
  stats_dir: hindi/reports
  logs_dir: hindi/logs
cleaning:
  script: devanagari
  min_chars: 200
  min_words: 25
  max_chars: 500000
  min_script_ratio: 0.7
  max_replacement_ratio: 0.002
  max_duplicate_line_ratio: 0.3
  max_top_ngram_ratio: 0.2
  max_digit_ratio: 0.2
  max_symbol_ratio: 0.1
  max_char_run: 20
  check_language_identity: true
  dedup_exact: true
  dedup_near: false
  near_dup_threshold: 0.7
  minhash_permutations: 96
  shingle_size: 5
splits:
  train: 0.98
  validation: 0.01
  test: 0.01
  seed: 20260812
  pinned_sources: {}
tokenizer:
  model_type: unigram
  vocab_size: 8000
  character_coverage: 0.9995
  byte_fallback: true
  split_digits: true
  normalization_rule_name: identity
  seed: 20260812
  sweep_vocab_sizes:
  - 5000
  - 6000
  - 8000
  - 10000
  sweep_model_types:
  - unigram
  - bpe
  input_sentence_size: 400000
  num_threads: 4
profiles:
  sampled:
    per_source_doc_limit: 4000
    tokenizer_max_train_lines: 300000
    sweep_max_train_lines: 150000
    target_train_tokens: null
    splits:
      train: 0.88
      validation: 0.06
      test: 0.06
  full:
    per_source_doc_limit: null
    tokenizer_max_train_lines: 200000
    sweep_max_train_lines: 1000000
    target_train_tokens: 500000000
